
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HF Router Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fff;
    margin:20px;
    padding-bottom:100px;
}

.logo{
    margin-bottom:8px;
}

h1{
    font-size:24px;
    margin:0;
}

.tagline{
    color:#666;
    margin:10px 0 20px 0;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    margin-bottom:12px;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:12px 16px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.output{
    margin-top:20px;
    border:1px solid #ccc;
    background:#f8f8f8;
    padding:12px;
    min-height:250px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    border-top:1px solid #ddd;
    padding:12px;
    text-align:center;
}

.buy-btn{
    background:#007bff;
}
</style>
</head>

<body>

<div class="logo">
    IMG_1741.jpeg
</div>

<h1>HF Router Test</h1>

<div class="tagline">
    Direct native fetch() test.
</div>

<label>Hugging Face API Key</label>

<input
    id="apiKey"
    type="password"
    placeholder="hf_xxxxxxxxxxxxxxxxx"
/>

<button onclick="runTest()">
    Run Test
</button>

<div id="output" class="output">
Ready.
</div>

<div class="footer">
    <button class="buy-btn">
        Buy This Tool
    </button>
</div>

<script>

async function runTest() {

    const key =
        document.getElementById("apiKey").value.trim();

    const output =
        document.getElementById("output");

    if (!key) {

        output.textContent =
            "Enter a Hugging Face API key.";

        return;
    }

    output.textContent =
        "Testing...";

    try {

        const response = await fetch(
            "https://router.huggingface.co/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${key}`
                },

                body: JSON.stringify({
                    model: "deepseek-ai/DeepSeek-V3-0324",
                    messages: [
                        {
                            role: "user",
                            content: "Reply with TEST OK"
                        }
                    ],
                    max_tokens: 10
                })
            }
        );

        const rawText =
            await response.text();

        let report = "";

        report += "HF ROUTER TEST\n";
        report += "==============\n\n";

        report +=
            "HTTP Status: "
            + response.status
            + "\n\n";

        report +=
            "Router Reachable: "
            + (
                response.status !== 0
                ? "YES"
                : "NO"
            )
            + "\n";

        report +=
            "Likely Key Valid: "
            + (
                response.status === 200
                ? "YES"
                : "UNKNOWN"
            )
            + "\n\n";

        report +=
            "Raw Response\n";
        report +=
            "------------\n";
        report +=
            rawText;

        output.textContent =
            report;

    }
    catch(err) {

        output.textContent =
`HF ROUTER TEST

ERROR

${err.message}

Router Reachable:
NO

Key Valid:
UNKNOWN`;
    }
}

</script>

</body>
</html>
