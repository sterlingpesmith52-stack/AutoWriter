
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AutoWriter</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    padding-bottom: 90px;
    background: #ffffff;
    -webkit-text-size-adjust: 100%;
}

/* Header */

.mf-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 12px;
}

.mf-logo {
    height: 32px;
    width: auto;
    margin-bottom: 4px;
}

h1 {
    margin: 0;
    text-align: left;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.2;
}

.tagline {
    font-size: 14px;
    color: #666;
    margin-top: 8px;  /* half-line spacing */
    margin-bottom: 12px;
}

/* Input */

.input-box {
    width: 100%;
    height: 140px;
    max-height: 140px;
    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 12px;
    font-size: 17px;
    resize: none;
    overflow-y: auto;
}

.input-box:focus {
    outline: none;
    border: 1px solid #ccc;
    box-shadow: none;
    -webkit-tap-highlight-color: transparent;
}

/* Buttons */

.button-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.run-button,
.copy-button,
.buy-button {
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.clear-button {
    background: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

/* Output */

.output-box {
    width: 100%;
    min-height: 140px;
    background: #f7f7f7;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-sizing: border-box;
    white-space: pre-wrap;
    font-size: 16px;
}

/* Footer */

.mf-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    border-top: 1px solid #ddd;
    padding: 12px;
    text-align: center;
    z-index: 999;
}

/* Hide footer while keyboard/input is active */

body.keyboard-open .mf-footer {
    display: none;
}
</style>

<script>
function runAutoWriter() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    if (!input) {
        output.textContent = "Please enter text.";
        return;
    }

    output.textContent = "AutoWriter output:\n\n" + input;
}

function copyOutput() {
    const text = document.getElementById("output").textContent;

    if (!text.trim()) return;

    navigator.clipboard.writeText(text);
}

function clearAll() {
    document.getElementById("input").value = "";
    document.getElementById("output").textContent = "";
}

document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("input");

    input.addEventListener("focus", () => {
        document.body.classList.add("keyboard-open");
    });

    input.addEventListener("blur", () => {
        document.body.classList.remove("keyboard-open");
    });
});
</script>

</head>
<body>

<div class="mf-header">
    IMG_1741.jpeg

    <h1>AutoWriter</h1>

    <div class="tagline">
        Turn rough ideas into ready-to-use content.
    </div>
</div>

<textarea
    id="input"
    class="input-box"
    placeholder="Enter ideas, notes, or rough text..."
></textarea>

<div class="button-row">
    <button class="run-button" onclick="runAutoWriter()">Run</button>
    <button class="copy-button" onclick="copyOutput()">Copy</button>
    <button class="clear-button" onclick="clearAll()">Clear</button>
</div>

<div id="output" class="output-box"></div>

<div class="mf-footer">
    <button class="buy-button">Buy This Tool</button>
</div>

</body>
</html>
