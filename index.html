
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>AutoWriter</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    padding-bottom:110px;
    background:#ffffff;
    -webkit-text-size-adjust:100%;
}

.mf-header{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    margin-bottom:12px;
}

.mf-logo{
    height:32px;
    width:auto;
    margin-bottom:4px;
}

h1{
    margin:0;
    font-size:24px;
    font-weight:600;
    line-height:1.2;
    text-align:left;
}

.tagline{
    font-size:14px;
    color:#666;
    margin-top:8px;
    margin-bottom:12px;
}

.input-box{
    width:100%;
    height:140px;
    max-height:140px;
    background:#ffffff;
    border:1px solid #ccc;
    border-radius:6px;
    padding:10px;
    box-sizing:border-box;
    margin-bottom:12px;
    font-size:17px;
    overflow-y:auto;
    resize:none;
}

.input-box:focus{
    outline:none;
    border:1px solid #ccc;
    box-shadow:none;
    -webkit-tap-highlight-color:transparent;
}

.button-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.run-button,
.copy-button,
.clear-button,
.buy-button{
    border:none;
    border-radius:6px;
    padding:10px 18px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.run-button,
.copy-button,
.buy-button{
    background:#007bff;
    color:#ffffff;
}

.clear-button{
    background:#000000;
    color:#ffffff;
}

.output-box{
    width:100%;
    min-height:180px;
    background:#f7f7f7;
    border:1px solid #ccc;
    border-radius:6px;
    padding:10px;
    box-sizing:border-box;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    font-size:16px;
}

.mf-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#ffffff;
    border-top:1px solid #ddd;
    padding:12px;
    text-align:center;
}

body.keyboard-open .mf-footer{
    display:none;
}
</style>
</head>

<body>

<div class="mf-header">

    <img
        src="IMG_1741.jpeg"
        alt="MicroFoundary Logo"
        class="mf-logo">

    <h1>AutoWriter</h1>

    <div class="tagline">
        Turn ideas into polished content in seconds.
    </div>

</div>

<textarea
    id="input"
    class="input-box"
    placeholder="Describe what you want AutoWriter to create..."></textarea>

<div class="button-row">

    <button
        class="run-button"
        onclick="runAutoWriter()">
        Generate
    </button>

    <button
        class="copy-button"
        onclick="copyOutput()">
        Copy
    </button>

    <button
        class="clear-button"
        onclick="clearOutput()">
        Clear
    </button>

</div>

<div
    id="output"
    class="output-box">
Ready.
</div>

<div class="mf-footer">

    <button class="buy-button">
        Buy This Tool
    </button>

</div>

<script>
const HF_API_KEY = "PASTE_YOUR_HUGGING_FACE_KEY_HERE";

async function runAutoWriter(){

    const input =
        document.getElementById("input").value.trim();

    const output =
        document.getElementById("output");

    if(!input){
        output.textContent =
            "Please enter a prompt.";
        return;
    }

    output.textContent =
        "Generating...";

    try{

        const response =
            await fetch(
                "https://router.huggingface.co/v1/chat/completions",
                {
                    method:"POST",
                    headers:{
                        "Authorization":
                            `Bearer ${HF_API_KEY}`,
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        model:
                            "deepseek-ai/DeepSeek-V4.1-Flash",
                        messages:[
                            {
                                role:"user",
                                content:input
                            }
                        ]
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            output.textContent =
                "Error:\n\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                );

            return;
        }

        output.textContent =
            data?.choices?.[0]?.message?.content ||
            "No content returned.";

    }
    catch(error){

        output.textContent =
            "Error:\n\n" +
            error.message;
    }
}

function copyOutput(){

    navigator.clipboard.writeText(
        document.getElementById("output")
            .textContent
    );
}

function clearOutput(){

    document.getElementById("input")
        .value = "";

    document.getElementById("output")
        .textContent = "Ready.";
}

window.addEventListener(
    "focusin",
    function(event){

        if(
            event.target.tagName === "TEXTAREA" ||
            event.target.tagName === "INPUT"
        ){
            document.body.classList.add(
                "keyboard-open"
            );
        }
    }
);

window.addEventListener(
    "focusout",
    function(){

        setTimeout(function(){

            document.body.classList.remove(
                "keyboard-open"
            );

        },100);
    }
);
</script>

</body>
</html>
