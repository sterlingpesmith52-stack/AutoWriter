<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoWriter</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
    }

    h1 {
        margin: 0 0 12px 0;
        text-align: left;
        font-size: 24px;
        font-weight: 600;
    }

    .input-box {
        width: 100%;
        height: 140px;
        background: #ffffff;          /* FIXED: white background */
        border: 1px solid #ccc;       /* brand border */
        border-radius: 6px;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 12px;          /* brand spacing */
    }

    .run-button {
        display: inline-block;        /* FIXED: auto-width */
        background: #007bff;
        color: white;
        padding: 10px 18px;           /* brand padding */
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        text-align: left;             /* FIXED: left-aligned */
        margin-bottom: 12px;
    }

    .output-box {
        width: 100%;
        min-height: 140px;
        background: #e9e9e9;          /* brand output background */
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        box-sizing: border-box;
        white-space: pre-wrap;
    }
</style>

<script>
function runAutoWriter() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    if (!input) {
        output.textContent = "Please enter text.";
        return;
    }

    // Placeholder behavior — replace later with your real logic
    output.textContent = "AutoWriter output:\n\n" + input;
}
</script>

</head>
<body>

<h1>AutoWriter</h1>

<textarea id="input" class="input-box"></textarea>

<button class="run-button" onclick="runAutoWriter()">Run</button>

<div id="output" class="output-box"></div>

</body>
</html>
