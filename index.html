<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWriter</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .widget-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 8px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        .widget-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        .widget-output {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #ccc;
            background: #fafafa;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .widget-button {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }

        .widget-button:hover {
            background: #005fa3;
        }
    </style>
</head>

<body>
    <div class="widget-container">
        <div class="widget-title">AutoWriter</div>

        <div id="output" class="widget-output">
            <!-- Widget output appears here -->
        </div>

        <button class="widget-button" onclick="runWidget()">
            Run
        </button>
    </div>

    <script>
        function runWidget() {
            const output = document.getElementById("output");
            output.textContent = "Widget activated.";
        }
    </script>
</body>
</html>
