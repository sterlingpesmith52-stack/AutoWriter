<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>AutoWriter</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: none;             
        -webkit-text-size-adjust: 100%;
    }

    h1 {
        margin: 0 0 12px 0;
        text-align: left;
        font-size: 24px;
        font-weight: 600;
    }

    .input-box {
        width: 100%;
        height: 140px;
        max-height: 140px;
        background: #ffffff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 12px;
        font-size: 17px;
        overflow-y: auto;
    }

    /* FIXED: remove blue boundary when selected */
    .input-box:focus {
        outline: none;
        border: 1px solid #ccc;
        box-shadow: none;
    }

    .run-button {
        display: inline-block;
        background: #007bff;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        text-align: left;
        margin-bottom: 12px;
    }

    .output-box {
        width: 100%;
        min-height: 140px;
        background: #f7f7f7;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        box-sizing: border-box;
        white-space: pre-wrap;
        font-size: 16px;
    }
</style>

<script>
function runAutoWriter() {
    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    if (!input) {
        output.textContent = "Please enter text.";
        return;
    }

    output.textContent = "AutoWriter output:\n\n" + input;
}
</script>

</head>
<body>

<h1>AutoWriter</h1>

<textarea id="input" class="input-box"></textarea>

<button class="run-button" onclick="runAutoWriter()">Run</button>

<div id="output" class="output-box"></div>

</body>
</html>
