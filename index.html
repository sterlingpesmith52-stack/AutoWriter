<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>AutoWriter Diagnostic</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    padding-bottom: 90px;
    background: #ffffff;
    -webkit-text-size-adjust: 100%;
}

.mf-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 12px;
}

.mf-logo {
    height: 32px;
    width: auto;
    margin-bottom: 4px;
}

h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.2;
}

.tagline {
    font-size: 14px;
    color: #666;
    margin-top: 8px;
    margin-bottom: 12px;
}

.button-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.run-button,
.copy-button,
.buy-button {
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.clear-button {
    background: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.output-box {
    width: 100%;
    min-height: 250px;
    background: #f7f7f7;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-sizing: border-box;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

.mf-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    border-top: 1px solid #ddd;
    padding: 12px;
    text-align: center;
}

body.keyboard-open .mf-footer {
    display: none;
}
</style>
</head>

<body>

<div class="mf-header">
    IMG_1741.jpeg

    <h1>AutoWriter Diagnostic</h1>

    <div class="tagline">
        Diagnose AI connectivity and library loading.
    </div>
</div>

<div class="button-row">
    <button class="run-button" onclick="runDiagnostics()">
        Run Diagnostic
    </button>

    <button class="copy-button" onclick="copyOutput()">
        Copy
    </button>

    <button class="clear-button" onclick="clearOutput()">
        Clear
    </button>
</div>

<div id="output" class="output-box">
Press Run Diagnostic.
</div>

<div class="mf-footer">
    <button class="buy-button">
        Buy This Tool
    </button>
</div>

<script>
function copyOutput() {
    navigator.clipboard.writeText(
        document.getElementById("output").textContent
    );
}

function clearOutput() {
    document.getElementById("output").textContent =
        "Press Run Diagnostic.";
}

async function runDiagnostics() {

    const output = document.getElementById("output");

    let report = "";

    report += "AUTOWRITER DIAGNOSTIC REPORT\n";
    report += "===========================\n\n";

    report += "Window Checks\n";
    report += "-------------\n";

    report += "typeof Hf: ";
    report += typeof window.Hf;
    report += "\n";

    report += "typeof HfInference: ";
    report += typeof window.HfInference;
    report += "\n";

    report += "typeof InferenceClient: ";
    report += typeof window.InferenceClient;
    report += "\n\n";

    report += "HF-Related Globals\n";
    report += "------------------\n";

    const matches = Object.keys(window)
        .filter(k =>
            k.toLowerCase().includes("hf") ||
            k.toLowerCase().includes("hug") ||
            k.toLowerCase().includes("infer")
        );

    if (matches.length === 0) {
        report += "No HF-related globals detected.\n";
    } else {
        matches.forEach(name => {
            report += name + "\n";
        });
    }

    report += "\n";

    report += "CDN Test\n";
    report += "--------\n";

    try {

        const response = await fetch(
            "https://cdn.jsdelivr.net/npm/@huggingface/hf@latest/dist/hf.js"
        );

        report += "Old HF package status: ";
        report += response.status;
        report += "\n";

    } catch (err) {

        report += "Old HF package fetch failed:\n";
        report += err.message;
        report += "\n";
    }

    output.textContent = report;
}
</script>

</body>
</html>
