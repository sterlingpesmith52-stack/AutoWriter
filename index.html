<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>AutoWriter</title>

<script src="https://cdn.jsdelivr.net/npm/@huggingface/hf@latest/dist/hf.js">\</script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    padding-bottom: 90px;
    background: #fff;
    -webkit-text-size-adjust: 100%;
}

.mf-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 12px;
}

.mf-logo {
    height: 32px;
    width: auto;
    margin-bottom: 4px;
}

h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
}

.tagline {
    font-size: 14px;
    color: #666;
    margin-top: 8px;
    margin-bottom: 12px;
}

.input-box {
    width: 100%;
    height: 140px;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-sizing: border-box;
    font-size: 16px;
    resize: none;
    margin-bottom: 12px;
}

.button-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.run-button,
.copy-button,
.buy-button {
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.clear-button {
    background: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.output-box {
    width: 100%;
    min-height: 140px;
    background: #f7f7f7;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-sizing: border-box;
    white-space: pre-wrap;
}

.mf-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: white;
    border-top: 1px solid #ddd;
    padding: 12px;
    text-align: center;
}

body.keyboard-open .mf-footer {
    display: none;
}
</style>
</head>

<body>

<div class="mf-header">
    IMG_1741.jpeg

    <h1>AutoWriter</h1>

    <div class="tagline">
        Turn rough ideas into ready-to-use content.
    </div>
</div>

<textarea
    id="input"
    class="input-box"
    placeholder="Enter ideas, notes, or rough text..."
></textarea>

<div class="button-row">
    <button class="run-button" onclick="runAutoWriter()">Run</button>
    <button class="copy-button" onclick="copyOutput()">Copy</button>
    <button class="clear-button" onclick="clearAll()">Clear</button>
</div>

<div id="output" class="output-box"></div>

<div class="mf-footer">
    <button class="buy-button">
        Buy This Tool
    </button>
</div>

<script>

let client = null;

/* ASK FOR KEY */

window.addEventListener("load", async () => {

    const apiKey = prompt(
        "Enter your AI API key for testing"
    );

    if (!apiKey) {
        document.getElementById("output").textContent =
            "No API key entered.";
        return;
    }

    try {

        client = new Hf({
            apiKey: apiKey
        });

        console.log("Client initialized");

    } catch (err) {

        document.getElementById("output").textContent =
            "Client initialization failed: " +
            (err.message || err);

    }
});

/* FOOTER HIDE */

const inputBox = document.getElementById("input");

inputBox.addEventListener("focus", () => {
    document.body.classList.add("keyboard-open");
});

inputBox.addEventListener("blur", () => {
    document.body.classList.remove("keyboard-open");
});

/* RUN */

async function runAutoWriter() {

    const input = document.getElementById("input").value.trim();
    const output = document.getElementById("output");

    if (!input) {
        output.textContent = "Please enter text.";
        return;
    }

    if (!client) {
        output.textContent = "AI client not initialized.";
        return;
    }

    output.textContent = "Writing...";

    try {

        const stream = await client.responses.stream({
            model: "gpt-4.1-mini",
            messages: [
                {
                    role: "system",
                    content:
                    "Rewrite and expand the user's rough idea into polished, ready-to-use content. Never simply repeat the original text."
                },
                {
                    role: "user",
                    content: input
                }
            ]
        });

        output.textContent = "";

        for await (const chunk of stream) {

            if (chunk.type === "response.output_text.delta") {
                output.textContent += chunk.delta;
            }

        }

    } catch (err) {

        output.textContent =
            "ERROR:\n\n" +
            (err.message || JSON.stringify(err));

        console.error(err);

    }
}

/* COPY */

function copyOutput() {

    const text =
        document.getElementById("output").textContent;

    if (!text.trim()) return;

    navigator.clipboard.writeText(text);
}

/* CLEAR */

function clearAll() {

    document.getElementById("input").value = "";
    document.getElementById("output").textContent = "";
}

</script>

</body>
</html>
